# AdaDSL SPEC — declarative rules (hot-reload planned, not yet wired)
# Current: static YAML compiled to both eval-harness check and live check
# Planned: NATS snapshot topic ada.dsl.snapshot → Flink-like broadcast hot-reload (like ADA)
# See: aws.amazon.com/blogs/big-data/how-razorpay-built-real-time-anomaly-detection-with-amazon-msk/
version: 1
tenant: merchant-001  # KeyBy(merchant_id)
rules:
  refund_abuse:
    window: 1h
    baseline: p95
    deviation: 3σ
    holiday_adjust: diwali
    action: BLOCK
    reason: "refund_abuse 3σ over p95"
  card_testing:
    window: 60s
    pattern: "5 consecutive declines -> success on same card/IP"
    cep: "5× decline + 1 success same card/IP in 60s"
    action: BLOCK
    source: "ADA Flink CEP example"
  velocity_spike:
    window: 1h
    baseline: p95
    deviation: 5×
    action: REVIEW
snapshot_topic: "ada.dsl.snapshot"
hot_reload: planned  # TODO: nats-link subscribe("ada.dsl.snapshot", |msg| reload_rules(msg))
