dataset-gen = { path = "../dataset-gen" }
webhook-consumer = { path = "../webhook-consumer" }
risk-graph = { path = "../risk-graph" }
pg-store = { path = "../pg-store" }
tower-http = { workspace = true, features = ["trace", "cors", "fs"] }
