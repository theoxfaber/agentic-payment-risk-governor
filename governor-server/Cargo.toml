[package]
name = "governor-server"
version = "0.1.0"
edition = "2021"

[dependencies]
risk-governor-types = { path = "../risk-governor-types" }
risk-governor-correlation = { path = "../risk-governor-correlation" }
action-service = { path = "../action-service" }
